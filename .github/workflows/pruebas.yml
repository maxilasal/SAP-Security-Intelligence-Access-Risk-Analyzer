name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Datos de prueba al día
        # El sistema ficticio se genera con scripts/build_demo_fixture.py: el JSON del repositorio debe coincidir.
        run: |
          python scripts/build_demo_fixture.py
          git diff --exit-code -- tests/fixtures/demo_system.json
      - name: Pruebas
        run: python -m pytest -q

  servicio-windows:
    # Prueba real: tarea programada de Windows con usuario y contraseña, modo red (HTTPS), caída y recuperación.
    name: servicio continuo · Windows (tarea programada real)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar como en un servidor (.venv)
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --quiet --disable-pip-version-check -e .
      - name: Instalar como servicio, tirarla, verificar que vuelve, detener, iniciar y quitar
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\windows\prueba_servicio.ps1
      - name: Registros del servicio y de la aplicación
        if: always()
        shell: powershell
        run: |
          Get-Content data\logs\servicio.log -Encoding UTF8 -ErrorAction SilentlyContinue
          Get-Content data\logs\sapsec.log -Tail 80 -Encoding UTF8 -ErrorAction SilentlyContinue

