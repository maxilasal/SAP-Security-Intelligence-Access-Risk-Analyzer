name: Pruebas

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Datos de prueba al día
        # El sistema ficticio se genera con scripts/build_demo_fixture.py: el JSON del repositorio debe coincidir.
        run: |
          python scripts/build_demo_fixture.py
          git diff --exit-code -- tests/fixtures/demo_system.json
      - name: Pruebas
        run: python -m pytest -q
